<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit Text to Firebase</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f8f8f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input[type="text"] {
      padding: 1rem;
      font-size: 1.2rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 100%;
    }
    button {
      padding: 1rem;
      font-size: 1.2rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <input type="text" id="textInput" placeholder="Max 8 chars" maxlength="8">
    <button onclick="handleSubmit()">Submit</button>
  </div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // Replace with your own Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBb7Hf1EfZFt4ZBV7D-83ZoYh2_268-fA0",
  authDomain: "internetmap-40f5f.firebaseapp.com",
  databaseURL: "https://internetmap-40f5f-default-rtdb.firebaseio.com",
  projectId: "internetmap-40f5f",
  storageBucket: "internetmap-40f5f.firebasestorage.app",
  messagingSenderId: "58899228247",
  appId: "1:58899228247:web:d04ea480cc5ffbf4b06512",
  measurementId: "G-TR5860MX5M"
};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function handleSubmit() {
      const input = document.getElementById('textInput');
      const value = input.value.trim();

      // Only allow alphanumeric characters (no symbols)
      const valid = /^[\p{L}\p{N}]{1,8}$/u;


      if (!valid.test(value)) {
        alert('Only letters and numbers, max 8 characters.');
        return;
      }

      const timestamp = Date.now();
      db.ref('submissions/' + timestamp).set({
        text: value
      });

      input.value = '';
      alert('Submitted!');
    }
  </script>

</body>
</html>
