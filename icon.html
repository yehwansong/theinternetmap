<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
html, body {
  margin: 0;
  padding: 0;
  font-family: sans-serif;
  background: #fff;
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
}

.grid {
  display: flex;
  flex-direction: column;
  width: 100vw;
  padding: 10px 0;
}

.item {
  width: 100vw;
  padding: 16px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.icon-box {
  width: 40vw;
  height: 40vw;
  max-width: 200px;
  max-height: 200px;
  background: #f9f9f9;
  border-radius: 16px;
  border: 3px solid #ccc;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  box-sizing: border-box;
  transition: all 0.2s ease;
}

.icon-box.active {
  border-color: #0066ff;
  box-shadow: 0 0 10px rgba(0, 100, 255, 0.4);
}

.icon-box.disabled {
  opacity: 0.3;
  pointer-events: none;
  filter: grayscale(100%);
}

.icon-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.item-title {
  font-size: 1rem;
  color: #333;
  margin-top: 8px;
  text-align: center;
}

</style>


</head>
<body>

  <div class="grid" id="imgGrid"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
   <script>

    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
const titles = {
  "img-11.png": "내 홈페이지 만들기",
  "img-06.png": "광고로 부풀려진 링크의 증발",
  "img-07.png": "파도 병풍",
  "img-08.png": "파도 병풍",
  "img-10.png": "자발적인 언러닝과 언빌딩",
  "img-12.png": "얽힘망 던지기",
  "img-13.png": "인터넷 바다 낚시",
  "img-14.png": "근원을 알 수 없는 초호화 여객선 런칭",
  "img-15.png": "오징어 집어등대",
  "img-16.png": "목적지를 알 수 없는 탈출용 다리",
  "img-17.png": "정보의 무조건적 지급",
  "img-18.png": "성곽 위 성곽",
  "img-19.png": "성벽 안 유리천장",
  "img-20.png": "끝이 보이지 않는 탈출용 계단"
};

    const imageMap = {
      "img-11.png": [5, 2],
      "img-06.png": [1, 0],
      "img-07.png": [2, 1],
      "img-08.png": [3, 1],
      "img-10.png": [4, 0],
      "img-12.png": [6, 0],
      "img-13.png": [7, 1],
      "img-14.png": [8, 0],
      "img-15.png": [0, 0],
      "img-16.png": [9, 4],
      "img-17.png": [10, 1],
      "img-18.png": [11, 8],
      "img-19.png": [12, 0],
      "img-20.png": [13, 4]
    };

    const state = {};
    const usedReflects = {};
    const container = document.getElementById("imgGrid");

    Object.entries(imageMap).forEach(([filename, [imgIndex, maxReflect]]) => {
      const wrapper = document.createElement("div");
      wrapper.className = "item";

const box = document.createElement("div");
box.className = "icon-box";

const thumb = document.createElement("img");
thumb.src = "extraimg/" + filename;
thumb.dataset.filename = filename;
thumb.dataset.imgIndex = imgIndex;
thumb.dataset.max = maxReflect;

box.appendChild(thumb);
wrapper.appendChild(box);


      const label = document.createElement("div");
      label.className = "item-title";
      label.innerText = titles[filename] || filename;

      wrapper.appendChild(label);

      container.appendChild(wrapper);

      state[filename] = 0;
    });

    firebase.database().ref('clicks').once('value', (snapshot) => {
      snapshot.forEach(child => {
        const { imgIndex, reflectIndex } = child.val();
        const key = `${imgIndex}-${reflectIndex}`;
        usedReflects[key] = true;
      });

document.querySelectorAll('.icon-box img').forEach(img => {
  const filename = img.dataset.filename;
  const imgIndex = +img.dataset.imgIndex;
  const maxReflect = +img.dataset.max;

  let usedCount = 0;
  for (let i = 0; i <= maxReflect; i++) {
    if (usedReflects[`${imgIndex}-${i}`]) usedCount++;
  }

  state[filename] = usedCount;

  const box = img.closest('.icon-box');
  if (usedCount > maxReflect) {
    box.classList.add('disabled');
  } else {
    box.classList.add('active');
  }
});

    });
const CLICK_LIMIT = 5;
const TIME_WINDOW_MS = 180000; // 3 minutes
const STORAGE_KEY = "clickLimiterTimestamps";

// 🧠 Get recent valid timestamps
function getStoredTimestamps() {
  const raw = localStorage.getItem(STORAGE_KEY);
  try {
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}

// 🧠 Save updated timestamps
function saveTimestamps(timestamps) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(timestamps));
}

// 🚫 Check if user can click now
function isClickAllowed() {
  const now = Date.now();
  let timestamps = getStoredTimestamps();
  timestamps = timestamps.filter(ts => now - ts < TIME_WINDOW_MS); // Keep only recent
  saveTimestamps(timestamps);
  return timestamps.length < CLICK_LIMIT;
}

// ✅ Register a new click
function registerClick() {
  const now = Date.now();
  const timestamps = getStoredTimestamps().filter(ts => now - ts < TIME_WINDOW_MS);
  timestamps.push(now);
  saveTimestamps(timestamps);
}

// ⏱️ Get time left until next allowed click
function getNextClickDelayMs() {
  const timestamps = getStoredTimestamps().filter(ts => Date.now() - ts < TIME_WINDOW_MS);
  if (timestamps.length < CLICK_LIMIT) return 0;
  return timestamps[0] + TIME_WINDOW_MS - Date.now();
}
container.addEventListener('click', (e) => {
  if (!e.target.matches('img')) return;

  // ✅ Enforce click limit
  if (!isClickAllowed()) {
    const delay = Math.ceil(getNextClickDelayMs() / 1000);
    alert(`⏳ 선택 한도가 초과되었습니다. ${delay}초 후에 다시 시도하세요.`);
    return;
  }

  const img = e.target;
  const filename = img.dataset.filename;
  const imgIndex = +img.dataset.imgIndex;
  const maxReflect = +img.dataset.max;
  let reflectIndex = state[filename];

  if (reflectIndex > maxReflect) return;
  const key = `${imgIndex}-${reflectIndex}`;
  if (usedReflects[key]) return;

  // ✅ Register the click
  usedReflects[key] = true;
  state[filename]++;
  registerClick(); // Track in localStorage

  firebase.database().ref('clicks').push({
    imgIndex,
    reflectIndex,
    timestamp: Date.now()
  });

  if (state[filename] > maxReflect) {
    img.classList.add('disabled');
  }
});

  </script>
